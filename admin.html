<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">📚 Admin Dashboard</h2>

    <!-- Add Book -->
    <div class="card p-3 shadow">

        <input type="text"
               id="bookName"
               class="form-control mb-2"
               placeholder="Book Name">

        <input type="text"
               id="author"
               class="form-control mb-2"
               placeholder="Author Name">

        <button class="btn btn-success"
                onclick="addBook()">
            Add Book
        </button>

    </div>

    <!-- Added Books -->
    <h3 class="mt-5">📖 Added Books</h3>

    <div id="bookList" class="mt-3"></div>

    <!-- Issued Books -->
    <h3 class="mt-5">📚 Issued Books</h3>

    <div id="issuedBooksList"></div>

</div>

<script>

function addBook(){

    let bookName =
    document.getElementById("bookName").value;

    let author =
    document.getElementById("author").value;

    if(bookName.trim() === "" || author.trim() === ""){

        alert("Please enter Book Name and Author");

        return;
    }

    let books =
    JSON.parse(localStorage.getItem("books")) || [];

    books.push({
        name: bookName,
        author: author
    });

    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );

    document.getElementById("bookName").value = "";
    document.getElementById("author").value = "";

    showBooks();
}



function showBooks(){

    let books =
    JSON.parse(localStorage.getItem("books")) || [];

    let output = "";

    if(books.length === 0){

        output = `
        <div class="alert alert-warning">
            No Books Added Yet
        </div>
        `;
    }

    books.forEach((book,index)=>{

        output += `
        <div class="card p-3 mb-2 shadow-sm">

            <h5>${book.name}</h5>

            <p>
                <strong>Author:</strong>
                ${book.author}
            </p>

            <button class="btn btn-danger"
                    onclick="deleteBook(${index})">
                Delete
            </button>

        </div>
        `;
    });

    document.getElementById("bookList").innerHTML =
    output;
}



function deleteBook(index){

    let books =
    JSON.parse(localStorage.getItem("books")) || [];

    books.splice(index,1);

    localStorage.setItem(
        "books",
        JSON.stringify(books)
    );

    showBooks();
}



function showIssuedBooks(){

    let books =
    JSON.parse(localStorage.getItem("issuedBooks")) || [];

    let html = "";

    if(books.length === 0){

        html = `
        <div class="alert alert-warning">
            No Books Issued Yet
        </div>
        `;
    }

    books.forEach(book => {

        html += `
        <div class="card p-3 mb-2 shadow-sm">

            <h5>${book.book}</h5>

            <p>
                <strong>Student:</strong>
                ${book.student}
            </p>

            <p>
                <strong>Issue Date:</strong>
                ${book.issueDate}
            </p>

            <p>
                <strong>Return Date:</strong>
                ${book.returnDate}
            </p>

        </div>
        `;
    });

    document.getElementById("issuedBooksList").innerHTML =
    html;
}



showBooks();
showIssuedBooks();

</script>

</body>
</html>
